<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산 서구 의료관광 파트너스 - 모바일 쿠폰팩</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .modal-animate {
            animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <span class="text-xs text-blue-400 font-semibold tracking-wider block">BUSAN SEO-GU</span>
                <h1 class="text-lg font-bold">의료관광 파트너스 쿠폰팩</h1>
            </div>
            <span class="bg-blue-600/30 text-blue-300 text-xs px-2.5 py-1 rounded-full border border-blue-500/30">VIP Pass</span>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-6 space-y-6">
        <!-- Welcome Banner -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg">
            <h2 class="text-xl font-bold mb-1">환영합니다! 👋</h2>
            <p class="text-sm opacity-90 leading-relaxed">
                서구 파트너스 업체의 혜택을 자유롭게 이용하세요.<br>
                원하시는 혜택의 <b>[혜택 보기]</b>를 누르면 현장 제시용 쿠폰이 발급됩니다.
            </p>
        </div>

        <!-- Filter Buttons -->
        <div class="flex gap-2 overflow-x-auto pb-1 text-sm no-scrollbar">
            <button onclick="filterCategory('all')" class="filter-btn active bg-slate-800 text-white px-4 py-2 rounded-xl font-medium whitespace-nowrap shadow-sm">전체</button>
            <button onclick="filterCategory('hotel')" class="filter-btn bg-white text-slate-600 px-4 py-2 rounded-xl font-medium whitespace-nowrap border shadow-sm">🏨 호텔</button>
            <button onclick="filterCategory('wellness')" class="filter-btn bg-white text-slate-600 px-4 py-2 rounded-xl font-medium whitespace-nowrap border shadow-sm">♨️ 웰니스/기타</button>
            <button onclick="filterCategory('food')" class="filter-btn bg-white text-slate-600 px-4 py-2 rounded-xl font-medium whitespace-nowrap border shadow-sm">🍽️ 음식/카페</button>
        </div>

        <!-- Coupon List -->
        <div id="couponList" class="space-y-4"></div>
    </main>

    <!-- LARGE COUPON POPUP MODAL -->
    <div id="couponModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl modal-animate border border-slate-100">
            <div class="bg-blue-600 text-white p-5 text-center relative">
                <span class="inline-block bg-white/20 text-xs px-3 py-1 rounded-full mb-2 font-medium">현장 제시용 모바일 쿠폰</span>
                <h3 id="modalCategory" class="text-sm font-medium opacity-90">파트너스 혜택</h3>
            </div>
            <div class="p-6 text-center space-y-4">
                <div>
                    <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-1">PARTNER NAME</span>
                    <h2 id="modalPartner" class="text-2xl font-black text-slate-900 leading-tight">업체명</h2>
                </div>
                <div class="bg-amber-50 border-2 border-dashed border-amber-400 rounded-2xl p-4 my-2">
                    <span class="text-xs text-amber-700 font-semibold block mb-1">특별 할인 혜택</span>
                    <div id="modalDiscount" class="text-xl font-extrabold text-amber-600 break-keep">혜택 내용</div>
                </div>
                <div class="bg-slate-50 p-3.5 rounded-xl text-left border border-slate-200/60">
                    <p class="text-[11px] text-slate-500 leading-relaxed">
                        • 인스타그램 최초 1회 팔로우 후 모든 혜택을 이용할 수 있습니다.<br>
                        • 결제 전 매장 직원에게 <b>이 화면</b>을 보여주세요.<br>
                    </p>
                </div>
                <div class="pt-2 space-y-3">
                    <!-- 🟢 1. 인스타그램 팔로우 유도 버튼 -->
                    <button id="instaBtn" onclick="clickInsta()" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3.5 rounded-xl font-bold shadow-md hover:opacity-90 transition flex items-center justify-center gap-2">
                        <span>📸 인스타그램 팔로우하기</span>
                    </button>
                    
                    <!-- 🟢 2. 쿠폰 사용 승인 버튼 -->
                    <button id="issueBtn" onclick="issueCoupon()" class="w-full bg-slate-200 text-slate-500 py-3.5 rounded-xl font-bold transition cursor-not-allowed">
                        먼저 팔로우를 눌러주세요
                    </button>

                    <button onclick="closeModal()" class="w-full bg-transparent text-slate-400 py-2 text-sm font-medium hover:text-slate-600 underline mt-1">
                        돌아가기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const coupons = [
            { id: 'H01', category: 'hotel', categoryLabel: '🏨 호텔', partner: '윈덤그랜드부산', discount: '객실 10% 할인권', desc: '최고급 해변 뷰 객실 이용 시 10% 현장 할인' },
            { id: 'W01', category: 'wellness', categoryLabel: '♨️ 웰니스', partner: '스파해수랑', discount: '사우나 + 찜질방 10% 할인', desc: '바다 전망 노천탕 및 오션뷰 찜질방 할인' },
            { id: 'F01', category: 'food', categoryLabel: '☕ 카페', partner: 'EL 16.52', discount: '음료 주문 시 시그니처 기념품 증정', desc: '송도 해상케이블카 뷰 카페 특별 혜택' },
            { id: 'H02', category: 'hotel', categoryLabel: '🏨 호텔', partner: '페어필드 바이 메리어트', discount: '숙박 객실 10% 할인', desc: '송도 해수욕장 정면 위치 호텔 할인' },
            { id: 'F02', category: 'food', categoryLabel: '🍽️ 음식점', partner: '김형제고기의철학', discount: '메인 메뉴 주문 시 사이드 메뉴 서비스', desc: '프리미엄 숙성육 전문점 파트너스 혜택' }
        ];

        let currentCoupon = null;
        
        // 🟢 스마트 기억 장치 (한 번만 인증하면 전체에 적용됩니다)
        let isFollowed = false; // 팔로우 버튼을 한 번이라도 눌렀는지 기억
        let usedCoupons = []; // 이미 혜택 사용 완료(녹색) 처리된 쿠폰 ID 기억

        function renderCoupons(filter = 'all') {
            const listContainer = document.getElementById('couponList');
            listContainer.innerHTML = '';
            const filteredCoupons = filter === 'all' ? coupons : coupons.filter(c => c.category === filter);

            filteredCoupons.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between space-y-4 hover:shadow-md transition";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-medium">${item.categoryLabel}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900">${item.partner}</h3>
                        <p class="text-base font-extrabold text-blue-600 mt-1">${item.discount}</p>
                        <p class="text-xs text-slate-500 mt-1">${item.desc}</p>
                    </div>
                    <button onclick="openModal('${item.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-sm active:scale-95">
                        혜택 보기
                    </button>
                `;
                listContainer.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-white', 'active');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            event.target.classList.remove('bg-white', 'text-slate-600');
            event.target.classList.add('bg-slate-800', 'text-white', 'active');
            renderCoupons(cat);
        }

        // 팝업창이 열릴 때마다 상태를 체크하여 알아서 화면을 바꿔줍니다.
        function openModal(couponId) {
            currentCoupon = coupons.find(c => c.id === couponId);
            if (!currentCoupon) return;

            document.getElementById('modalCategory').innerText = currentCoupon.categoryLabel + ' 혜택';
            document.getElementById('modalPartner').innerText = currentCoupon.partner;
            document.getElementById('modalDiscount').innerText = currentCoupon.discount;

            const instaBtn = document.getElementById('instaBtn');
            const issueBtn = document.getElementById('issueBtn');

            // 🟢 로직 1: 시스템에 팔로우 기록이 없을 때 (최초 1회)
            if (!isFollowed) {
                instaBtn.style.display = 'flex'; // 인스타 버튼 활성화
                issueBtn.disabled = true;
                issueBtn.innerText = '먼저 팔로우를 눌러주세요';
                issueBtn.className = 'w-full bg-slate-200 text-slate-500 py-3.5 rounded-xl font-bold transition cursor-not-allowed';
            } 
            // 🟢 로직 2: 팔로우 기록이 있을 때 (다른 쿠폰 열 때 자동으로 여기로 빠집니다)
            else {
                instaBtn.style.display = 'none'; // 인스타 버튼은 영원히 숨김
                
                // 만약 이 쿠폰을 이미 사용(녹색)했다면?
                if (usedCoupons.includes(currentCoupon.id)) {
                    issueBtn.disabled = true;
                    issueBtn.innerText = '✅ 직원을 향해 이 화면을 보여주세요 (발급 완료)';
                    issueBtn.className = 'w-full bg-emerald-500 text-white py-4 rounded-xl font-bold cursor-default';
                } 
                // 아직 혜택 사용 안 한 새 쿠폰이라면?
                else {
                    issueBtn.disabled = false;
                    issueBtn.innerText = '🎁 혜택 사용하기';
                    issueBtn.className = 'w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold shadow-md transition active:scale-95';
                }
            }

            document.getElementById('couponModal').classList.remove('hidden');
        }

        function clickInsta() {
            // 새 창으로 지정된 서구 의료관광 인스타그램 접속
            window.open('https://www.instagram.com/bsseogumedihub/', '_blank');
            
            // 🟢 "나 팔로우 했어!" 라고 시스템 전체에 기억시킵니다.
            isFollowed = true;
            
            // 현재 열려있는 팝업창도 즉시 '사용 가능' 상태로 업데이트
            document.getElementById('instaBtn').style.display = 'none';
            const issueBtn = document.getElementById('issueBtn');
            issueBtn.disabled = false;
            issueBtn.innerText = '🎁 혜택 사용하기';
            issueBtn.className = 'w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold shadow-md transition active:scale-95';
        }

        function issueCoupon() {
            // "이 쿠폰(ID)은 혜택을 사용했다" 라고 장부에 적어둡니다.
            usedCoupons.push(currentCoupon.id);
            
            const issueBtn = document.getElementById('issueBtn');
            issueBtn.innerText = '✅ 직원을 향해 이 화면을 보여주세요';
            issueBtn.className = 'w-full bg-emerald-500 text-white py-4 rounded-xl font-bold cursor-default';
            issueBtn.disabled = true; 
        }

        function closeModal() {
            document.getElementById('couponModal').classList.add('hidden');
        }

        renderCoupons();
    </script>
</body>
</html>
